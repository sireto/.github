name: PR Issue Link Check

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  check-linked-issue:
    runs-on: ubuntu-latest
    steps:
      - name: Check PR body for linked issue
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request.body || "";
            const issuePattern = /(Closes|Fixes|Resolves)\s+#\d+/i;
            if (!issuePattern.test(body)) {
              core.setFailed("Pull request must link to an issue using Closes #123, Fixes #123, or Resolves #123.");
            }
