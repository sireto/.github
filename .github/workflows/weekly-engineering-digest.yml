name: Weekly Engineering Digest

on:
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  issues: read
  pull-requests: read
  contents: read

jobs:
  weekly-digest:
    runs-on: ubuntu-latest
    steps:
      - name: Build weekly digest
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const now = new Date();
            const since = new Date(now.getTime() - 7 * 24 * 60 * 60 * 1000).toISOString();

            const issues = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: 'all',
              since,
              per_page: 100
            });

            const pulls = await github.rest.pulls.list({
              owner,
              repo,
              state: 'all',
              sort: 'updated',
              direction: 'desc',
              per_page: 100
            });

            const openedIssues = issues.data.filter(i => !i.pull_request && new Date(i.created_at) >= new Date(since));
            const closedIssues = issues.data.filter(i => !i.pull_request && i.closed_at && new Date(i.closed_at) >= new Date(since));
            const blockedIssues = issues.data.filter(i => !i.pull_request && i.state === 'open' && (i.labels || []).some(l => l.name === 'blocked'));
            const mergedPulls = pulls.data.filter(pr => pr.merged_at && new Date(pr.merged_at) >= new Date(since));

            const byAssignee = {};
            for (const issue of openedIssues.concat(closedIssues)) {
              const names = (issue.assignees || []).map(a => a.login);
              if (names.length === 0) {
                byAssignee['unassigned'] = (byAssignee['unassigned'] || 0) + 1;
              } else {
                for (const name of names) {
                  byAssignee[name] = (byAssignee[name] || 0) + 1;
                }
              }
            }

            core.summary.addHeading('Weekly engineering digest');
            core.summary.addRaw(`Repository: ${owner}/${repo}\n\n`);
            core.summary.addRaw(`Opened issues: ${openedIssues.length}\n`);
            core.summary.addRaw(`Closed issues: ${closedIssues.length}\n`);
            core.summary.addRaw(`Merged pull requests: ${mergedPulls.length}\n`);
            core.summary.addRaw(`Currently blocked issues: ${blockedIssues.length}\n\n`);

            core.summary.addHeading('Work by assignee', 2);
            const assignees = Object.keys(byAssignee).sort();
            if (assignees.length === 0) {
              core.summary.addRaw('No assignee activity in the last 7 days.\n\n');
            } else {
              for (const name of assignees) {
                core.summary.addRaw(`- ${name}: ${byAssignee[name]} items\n`);
              }
              core.summary.addRaw('\n');
            }

            core.summary.addHeading('Blocked issues', 2);
            if (blockedIssues.length === 0) {
              core.summary.addRaw('No blocked issues.\n');
            } else {
              for (const issue of blockedIssues.slice(0, 20)) {
                core.summary.addRaw(`- #${issue.number} ${issue.title}\n`);
              }
            }

            await core.summary.write();
