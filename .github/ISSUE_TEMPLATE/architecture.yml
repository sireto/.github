name: Architecture Decision
description: Propose or record a technical architecture decision
title: "[Architecture]: "
labels: ["type:architecture"]
body:
  - type: textarea
    id: problem_statement
    attributes:
      label: Problem statement
    validations:
      required: true

  - type: textarea
    id: current_state
    attributes:
      label: Current state
    validations:
      required: true

  - type: textarea
    id: proposed_approach
    attributes:
      label: Proposed approach
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: true

  - type: textarea
    id: risks
    attributes:
      label: Risks and trade-offs
    validations:
      required: true

  - type: textarea
    id: security_compliance
    attributes:
      label: Security and compliance impact
    validations:
      required: true

  - type: textarea
    id: rollout
    attributes:
      label: Rollout approach
    validations:
      required: true
