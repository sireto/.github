name: Bug
description: Report a defect, regression, or broken behavior
title: "[Bug]: "
labels: ["type:bug"]
body:
  - type: textarea
    id: observed_behavior
    attributes:
      label: Observed behavior
      description: What is happening now?
    validations:
      required: true

  - type: textarea
    id: expected_behavior
    attributes:
      label: Expected behavior
      description: What should happen instead?
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - Critical
        - High
        - Medium
        - Low
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: local, staging, production
    validations:
      required: true

  - type: textarea
    id: reproduction_steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Logs, screenshots, or evidence

  - type: textarea
    id: impact
    attributes:
      label: Impact
      description: Describe user, operational, or business impact.
    validations:
      required: true

  - type: textarea
    id: workaround
    attributes:
      label: Workaround
      description: Temporary mitigation if known.
