name: PR Issue Link Check

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  check-linked-issue:
    runs-on: ubuntu-latest
    steps:
      - name: Check PR body for a linked issue
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            if (pr.user.type === 'Bot') { core.info('Bot PR, skipping.'); return; }
            const body = pr.body || '';
            const pattern = /\b(Closes|Fixes|Resolves|Refs)\s+(?:[\w.-]+\/[\w.-]+)?#\d+/i;
            if (!pattern.test(body)) {
              core.setFailed('Link an issue in the PR description: "Fixes #123", or "Refs #123" if this PR does not close it.');
            }
